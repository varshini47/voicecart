name: hinglish_ambiguous_milk_brand
description: >
  "Doodh" (milk) matches multiple brands - the agent must ask which one
  instead of guessing, same as the English version.
turns:
  - user: "Do doodh add karo cart mein."
    expect_tools: [search_products]
    forbid_tools: [add_to_cart]
    expect_clarification: true
  - user: "Amul wala daal do."
    expect_tools: [add_to_cart]
expected_final_cart:
  - title: "Amul Toned Milk 500ml"
    quantity: 2
