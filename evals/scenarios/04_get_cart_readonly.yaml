name: get_cart_readonly
description: Asking what's in the cart is read-only and needs no confirmation or clarification.
turns:
  - user: "Add one Colgate Toothpaste to my cart."
  - user: "What's in my cart right now?"
    expect_tools: [get_cart]
    forbid_tools: [add_to_cart, remove_from_cart, checkout]
    expect_clarification: false
expected_final_cart:
  - title: "Colgate Toothpaste 100g"
    quantity: 1
