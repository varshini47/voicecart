name: simple_add_unambiguous
description: A single unambiguous item should be searched and added without any clarification.
turns:
  - user: "Add one Tata Salt to my cart."
    expect_tools: [search_products, add_to_cart]
    forbid_tools: [checkout]
    expect_clarification: false
expected_final_cart:
  - title: "Tata Salt 1kg"
    quantity: 1
