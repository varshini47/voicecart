<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoiceCart — Week 1 demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  button { font-size: 1.1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  #status { color: #666; margin-top: 0.75rem; }
  .turn { margin-top: 1.5rem; }
  .turn dt { font-weight: 600; }
  .turn dd { margin: 0 0 0.75rem 0; }
</style>
</head>
<body>
  <h1>VoiceCart</h1>
  <p>Click to start recording, speak, click again to send.</p>
  <button id="record">Start recording</button>
  <div id="status"></div>
  <dl class="turn" id="turn" hidden>
    <dt>You said</dt><dd id="transcript"></dd>
    <dt>VoiceCart replied</dt><dd id="reply-text"></dd>
  </dl>
  <audio id="reply-audio" controls hidden></audio>

<script>
const recordButton = document.getElementById("record");
const statusEl = document.getElementById("status");
const turnEl = document.getElementById("turn");
const transcriptEl = document.getElementById("transcript");
const replyTextEl = document.getElementById("reply-text");
const replyAudioEl = document.getElementById("reply-audio");

let mediaRecorder;
let chunks = [];

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
  chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();
  statusEl.textContent = "Recording... release to send.";
}

function stopRecording() {
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach((track) => track.stop());
}

async function onRecordingStopped() {
  statusEl.textContent = "Sending...";
  const blob = new Blob(chunks, { type: "audio/webm" });
  const formData = new FormData();
  formData.append("audio", blob, "utterance.webm");

  try {
    const response = await fetch("/converse", { method: "POST", body: formData });
    if (!response.ok) throw new Error(`Server returned ${response.status}`);
    const data = await response.json();

    transcriptEl.textContent = data.transcript || "(empty)";
    replyTextEl.textContent = data.reply_text;
    replyAudioEl.src = `data:audio/wav;base64,${data.reply_audio_base64}`;
    replyAudioEl.hidden = false;
    turnEl.hidden = false;
    statusEl.textContent = "Done.";
    await replyAudioEl.play();
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

recordButton.addEventListener("click", async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
    recordButton.textContent = "Start recording";
    return;
  }
  try {
    await startRecording();
    recordButton.textContent = "Stop recording";
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
});
</script>
</body>
</html>
