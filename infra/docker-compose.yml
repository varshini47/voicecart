# Local run of the deployed (text-mode) image — same one that ships to the
# EC2 instance in Milestone 4.2. Voice endpoints aren't part of this image;
# run `uvicorn agent.main:app` directly (outside Docker) for the full local
# voice demo instead.
services:
  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
